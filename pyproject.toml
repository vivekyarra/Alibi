[project]
name = "gridprint"
version = "0.1.0"
description = "GRIDPRINT: video authenticity from grid-frequency light flicker (rolling shutter ENF)."
requires-python = ">=3.11,<3.12"
dependencies = [
  "opencv-python-headless==5.0.0.93",
  "numpy",
  "av",
  "pyyaml",
  "pydantic>=2",
  "jinja2",
  "fastapi",
  "uvicorn",
  "python-multipart",
  "boto3",
  "matplotlib",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "types-PyYAML", "httpx"]
pdf = ["weasyprint"]
agent = ["mcp==1.28.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["engine/gridprint_engine/tests", "agent/tests", "tests", "eval/tests", "api/tests", "node/ingest/tests", "calibration_rig/tests", "mcp_server/tests", "capture-android/tests",
             "infra/tests", "bench/tests"]
pythonpath = [".", "engine"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["web", "capture-android", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
mypy_path = "engine"
explicit_package_bases = true
exclude = ["tests/", "/tests/"]

[[tool.mypy.overrides]]
# The bundled cv2 and PyAV stubs are incomplete (e.g. cv2.DISOpticalFlow_create exists at runtime but not
# in the stub; V3 verified it by calling it). Treat them as untyped.
module = ["cv2", "cv2.*", "av", "av.*"]
follow_imports = "skip"
follow_untyped_imports = false
