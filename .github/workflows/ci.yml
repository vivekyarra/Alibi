name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.11.8"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --all-groups --frozen
      - name: lint (ruff, mypy, claims_lint, check_numbers_sourced)
        run: make lint
      - name: unit and integration tests
        run: make test
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - name: axe-core accessibility check
        run: npm run a11y
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: dependency and container scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: "1"
          severity: CRITICAL
